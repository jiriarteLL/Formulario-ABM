  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

s-serif;background:var(--gray-light);color:var(--gray-dark);}\n  header{background:var(--black);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;}\n  header img{height:42px;}\n  .badge{color:var(--teal);font-weight:700;font-size:13px;letter-spacing:.5px;border:1px solid var(--teal);border-radius:20px;padding:6px 14px;}\n  .hero{background:var(--blue-dark);border-bottom:4px solid var(--teal);padding:38px 32px 30px;color:var(--white);}\n  .hero h1{margin:0 0 6px;font-size:28px;font-weight:800;}\n  .hero p{margin:0;color:#cfe4e8;font-size:14.5px;max-width:720px;line-height:1.5;}\n  main{max-width:840px;margin:0 auto;padding:36px 20px 80px;}\n  .card{background:var(--white);border:1px solid var(--border);border-radius:10px;margin-bottom:22px;box-shadow:0 2px 6px rgba(18,64,79,0.06);}\n  .card-body{padding:26px 28px;}\n  .section-title{font-size:14px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.6px;padding:14px 28px;border-bottom:1px solid var(--border);background:var(--blue-light);border-radius:9px 9px 0 0;}\n  .field{margin-bottom:20px;}\n  .field:last-child{margin-bottom:0;}\n  label{display:block;font-weight:700;font-size:14px;color:var(--black);margin-bottom:6px;}\n  label .req{color:var(--red);}\n  .hint{font-size:12.5px;color:var(--gray);margin:-2px 0 6px;}\n  input[type=text], input[type=email], input[type=date], select, textarea{\n    width:100%;padding:10px 12px;font-size:14.5px;font-family:inherit;\n    border:1px solid var(--border);border-radius:6px;background:var(--white);color:var(--gray-dark);\n  }\n  input:focus, select:focus, textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-light);}\n  textarea{resize:vertical;min-height:80px;}\n  .radio-group{display:flex;gap:10px;flex-wrap:wrap;}\n  .radio-group .radio-opt{flex:1 1 0;}\n  .radio-opt{min-width:90px;border:1.5px solid var(--border);border-radius:8px;padding:8px 20px;cursor:pointer;text-align:center;font-weight:600;font-size:13px;color:var(--gray-dark);transition:.15s;}\n  .radio-opt input{display:none;}\n  .radio-opt.sel{border-color:var(--teal);background:var(--teal-light);color:var(--teal-dark);}\n  .checklist{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 16px;}\n  .checklist label{font-weight:400;font-size:14px;display:flex;align-items:center;gap:8px;margin:0;cursor:pointer;}\n  .checklist input{width:16px;height:16px;accent-color:var(--teal);}\n  .alert{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:8px;font-size:13.5px;line-height:1.5;}\n  .alert.info{background:var(--blue-light);color:var(--blue-dark);border:1px solid #bcdde5;}\n  .alert.danger{background:#fbeaea;color:var(--red);border:1px solid #f0c6c6;}\n  .alert.teal{background:var(--teal-light);color:var(--teal-dark);border:1px solid #a9dede;}\n  .conditional{border-left:3px solid var(--teal);padding-left:16px;margin-top:16px;display:none;}\n  .conditional.show{display:block;}\n  .footer-note{font-size:13px;color:var(--gray);line-height:1.6;font-style:italic;}\n  .agree{display:flex;align-items:flex-start;gap:10px;margin-top:14px;}\n  .agree input{width:18px;height:18px;margin-top:2px;accent-color:var(--teal);}\n  .agree label{font-weight:600;font-size:14px;margin:0;}\n  button.submit{background:var(--teal-dark);color:var(--white);border:none;padding:14px 28px;font-size:15px;font-weight:800;border-radius:8px;cursor:pointer;width:100%;letter-spacing:.3px;}\n  button.submit:hover{background:var(--teal);}\n  button.submit:disabled{background:#bbb;cursor:not-allowed;}\n  .row2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}\n  @media(max-width:600px){.row2{grid-template-columns:1fr;}.checklist{grid-template-columns:1fr;}}\n  footer{background:var(--black);border-top:3px solid var(--teal);padding:24px 32px;text-align:center;color:#999;font-size:12.5px;}\n  footer img{height:26px;margin-bottom:8px;opacity:.85;}\n  .req-star::after{content:\" *\";color:var(--red);}\n  .tip{position:relative;display:inline-block;font-family:'Nunito Sans',sans-serif;font-size:14px;font-weight:400;font-style:normal;color:var(--teal-dark);cursor:help;text-transform:none;letter-spacing:0;}\n  .tip .tipbox{visibility:hidden;opacity:0;position:absolute;bottom:calc(100% + 12px);left:-10px;width:330px;background:var(--blue-dark);color:var(--white);padding:14px 16px;border-radius:10px;font-family:'Nunito Sans',sans-serif;font-size:13.5px;font-weight:400;font-style:normal;line-height:1.55;text-align:left;box-shadow:0 10px 26px rgba(18,64,79,.28);z-index:60;transition:opacity .12s;text-transform:none;letter-spacing:0;}\n  .tip .tipbox strong{font-weight:800;color:var(--white);}\n  .tip .tipbox::after{content:\"\";position:absolute;top:100%;left:16px;border:7px solid transparent;border-top-color:var(--blue-dark);}\n  .tip:hover .tipbox{visibility:visible;opacity:1;}\n  .tip.right .tipbox{left:auto;right:-10px;}\n  .tip.right .tipbox::after{left:auto;right:16px;}\n  .sublabel{font-weight:800;font-size:13px;color:var(--blue);text-transform:uppercase;letter-spacing:.4px;margin:0 0 10px;}\n</style>\n\n</head>\n<body>\n\n<header>\n  <img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABXEAAAHECAYAAAB/WWngAAAACXBIWXMAAAsSAAALEgHS3X78AAAgAElEQVR4nOzd3XNj13nn+x86kqyXkkn72EwqcYrwnMtz6pC+Ob4k9A+chq/WjuOE0IR+t9KUbMmSJZugYztzUjUjauZMVeJR0uiZTLJXJhmhq869wMu+MvkXCKypmpLoE5tMT5zYHjfOxV5gg2i+4GVtrLX3/n6qKDVJYOHhJkCCPzz7WbXBYKCV3e66pGVlGnqo7t409rFVzWf/go8dSDoZeb83/MfxTrM3fmEgNlv37tf18PEy+phadu+PWpa0NudNHur8Y0aS+u5taPRxdfD2p58dvzwAAAAAzxJj1iU1df7vAil7rn4gqZta2198ZcWRGFNXlk80dD6XOFF2DHuptb0Fl4VIufvL8DFXH/nU8P7STa09WHxlgD+1j7ff6UnaCF3IhI6U/dIbPgjP/n+80+TBiGC27t1vS9oJXceETpU9bqSHL5b0JOntTz/be/TiAFBdn/iz211JNyVJg0H2v5F/64J/n703/o/siu7io9cZucFHrp+9Vxu5jQcj/66NrnVuffd5PVrnYKyu2mDkRcHBQA+kk9pg+HtiIA2fcw0G+uCNb/QEALhUYkxLUluTNT7tS2oTRJ6XGNNQdgwnySmOJHVSa9s5loSIzXB/aafWdnIsCchN0ULc6wxD3oOR/x8c7zTpPkSuChbiXmcY8vbdW09S/+1PP9sPVhEABPCJP7u9LOmnZx8ob4h77jIPzn3s/PVrkh5kt3NUG/6eGAyy/7vnXh Htz/mgf6dzdjf3WAmiMSARlyAIgiAIgiAIgiAIgiAIIozRmnsABEEQBEEQBEEQBEEQBEEQRHBIxCUIgiAIgiAIgiAIgiAIgghjSMQlCIIgCIIgCIIgCIIgCIIIY0jEJQiCIAiCIAiCIAiCIAiCCGNIxCUIgiAIgiAIgiAIgiAIgghjSMQlCIIgCIIgCIIgCIIgCIIIY0jEJQiCIAiCIAiCIAiCIAiCCGP+H+4X4da/CRelAAAAAElFTkSuQmCC\" alt=\"LL&amp;A\">\n  <span class=\"badge\">Soporte Técnico · ABM 2026</span>\n</header>\n\n<div class=\"hero\">\n  <h1>Formulario ABM</h1>\n  <p>Alta, Baja o Modificación de usuarios. Completá todos los campos obligatorios (*). El tiempo de preparación de 1 a 10 equipos es de 4 días hábiles, sin excepción.</p>\n</div>\n\n<main>\n\n  <form id=\"abmForm\">\n\n    <!-- EQUIPOS Y LICENCIAS ASIGNADOS (solo lectura, se completa automaticamente si se abre desde la ficha) -->\n    <div class=\"card\" id=\"cardEquiposLicencias\" style=\"display:none;\">\n      <div class=\"section-title\">Equipos y licencias asignados actualmente</div>\n      <div class=\"card-body\">\n        <div class=\"row2\">\n          <div class=\"field\">\n            <label>Equipos</label>\n            <div id=\"listaEquipos\" style=\"font-size:14px;color:#333;\"></div>\n          </div>\n          <div class=\"field\">\n            <label>Licencias</label>\n            <div id=\"listaLicencias\" style=\"font-size:14px;color:#333;\"></div>\n          </div>\n        </div>\n      </div>\n    </div>\n\n    <!-- DATOS DE ABM -->\n    <div class=\"card\">\n      <div class=\"section-title\">Datos de ABM</div>\n      <div class=\"card-body\">\n        <datalist id=\"empleadosDatalist\"></datalist>\n        <div class=\"field\">\n          <label class=\"req-star\">Tipo de ABM</label>\n          <div class=\"radio-group\" id=\"tipoAbmGroup\">\n            <label class=\"radio-opt\" data-val=\"Alta\"><input type=\"radio\" name=\"tipoAbm\" value=\"Alta\">Alta</label>\n            <label class=\"radio-opt\" data-val=\"Baja\"><input type=\"radio\" name=\"tipoAbm\" value=\"Baja\">Baja</label>\n            <label class=\"radio-opt\" data-val=\"Modificación\"><input type=\"radio\" name=\"tipoAbm\" value=\"Modificación\">Modificación</label>\n          </div>\n        </div>\n\n        <div class=\"row2\">\n          <div class=\"field\">\n            <label class=\"req-star\">N° de Legajo <span class=\"tip\">ⓘ<span class=\"tipbox\" id=\"tipLegajo\">Número de legajo asignado en <strong>Portal GO</strong> por Gestión del Talento Humano. Si el ingresante todavía no lo tiene, GTH debe cargarlo antes de enviar el ABM.</span></span></label>\n            <input type=\"text\" id=\"legajo\" required=\"\">\n          </div>\n          <div class=\"field\">\n            <label class=\"req-star\" id=\"labelFechaEjecucion\"><span id=\"textoFechaEjecucion\">Fecha de ejecución</span> <span class=\"tip right\" id=\"tipFecha\">ⓘ<span class=\"tipbox\">Los permisos del usuario se cortan <strong>al finalizar el día de la fecha de ejecución</strong>. Si necesita conservar algún acceso más allá de ese día, hay que indicarlo expresamente en este pedido; si no se aclara nada, Soporte corta todo ese mismo día.</span></span></label>\n            <input type=\"date\" id=\"fechaEjecucion\" required=\"\">\n          </div>\n        </div>\n\n        <div class=\"field\">\n          <label class=\"req-star\">Solicitante de ABM <span class=\"tip\">ⓘ<span class=\"tipbox\">Quién genera este pedido, normalmente Gestión del Talento Humano o el manager del sector. Es la persona a la que Soporte le va a consultar ante cualquier duda.</span></span></label>\n          <input type=\"text\" id=\"solicitante\" required=\"\">\n        </div>\n\n        <!-- Condicional BAJA -->\n        <div class=\"conditional\" id=\"condBaja\">\n        </div>\n\n        <!-- Condicional ALTA -->\n        <div class=\"conditional\" id=\"condAlta\">\n        </div>\n\n\n      </div>\n    </div>\n\n    <!-- USUARIO -->\n    <div class=\"card\">\n      <div class=\"section-title\">Usuario</div>\n      <div class=\"card-body\">\n        <div class=\"row2\">\n          <div class=\"field\">\n            <label class=\"req-star\">Nombres <span class=\"tip\" id=\"tipNombres\">ⓘ<span class=\"tipbox\">Primer y segundo nombre. <strong>En lo posible agregá el segundo nombre si la persona lo tiene</strong>: cuantos más datos, más alternativas de casilla de correo puede generar Soporte cuando la primera opción ya está ocupada.</span></span></label>\n            <input type=\"text\" id=\"nombres\" required=\"\">\n          </div>\n          <div class=\"field\">\n            <label class=\"req-star\">Apellidos <span class=\"tip right\" id=\"tipApellidos\">ⓘ<span class=\"tipbox\">Primer y segundo apellido. <strong>En lo posible agregá el segundo apellido si la persona lo tiene</strong>: le da a Soporte más posibilidades para generar la casilla de correo si la primera combinación ya está en uso.<br><br>Si es un empleado existente (Baja o Modificación), elegilo de la lista para completar sus datos automáticamente.</span></span></label>\n            <input type=\"text\" id=\"apellidos\" list=\"empleadosDatalist\" autocomplete=\"off\" required=\"\">\n          </div>\n        </div>\n        <div class=\"field\" id=\"wrapEmailUsuario\" style=\"display:none;\">\n          <label class=\"req-star\">Mail del usuario <span class=\"tip\">ⓘ<span class=\"tipbox\">Casilla de correo de la persona que se da de baja. Soporte la usa para identificar la cuenta a desactivar y para gestionar el resguardo del buzón y la información.</span></span></label>\n          <input type=\"email\" id=\"emailUsuario\" placeholder=\"nombre.apellido@llyasoc.com\" autocomplete=\"off\">\n        </div>\n      </div>\n    </div>\n\n    <!-- CARACTERÍSTICAS DEL USUARIO -->\n    <div class=\"card\">\n      <div class=\"section-title\">Características del Usuario</div>\n      <div class=\"card-body\">\n        <div class=\"field\">\n          <label class=\"req-star\" id=\"labelManager\">Manager <span class=\"tip\">ⓘ<span class=\"tipbox\" id=\"tipManager\">Responsable del que depende el usua \n                <option>Junior A</option>\n                <option>Semi Senior</option>\n                <option>Senior D</option>\n                <option>Senior C</option>\n                <option>Senior B</option>\n                <option>Senior A</option>\n              </optgroup>\n              <optgroup label=\"Liderazgo\">\n                <option>Supervisor</option>\n                <option>Gerente</option>\n                <option>Gerente Senior</option>\n                <option>Director</option>\n                <option>Socio A</option>\n                <option>Socio B</option>\n              </optgroup>\n              <optgroup label=\"Consultoría / Especialistas\">\n                <option>Consultor</option>\n                <option>Especialista I</option>\n                <option>Especialista II</option>\n              </optgroup>\n              <optgroup label=\"Analistas\">\n                <option>Analista Supervisor</option>\n                <option>Analista Sr</option>\n                <option>Analista Semi Sr</option>\n              </optgroup>\n              <optgroup label=\"Asistentes / Ingreso\">\n                <option>Asistente Exp</option>\n                <option>Asistente Inicial</option>\n                <option>Senior Inicial</option>\n                <option>Senior Avanzado</option>\n              </optgroup>\n              <optgroup label=\"Abogacía\">\n                <option>Abogado Semi Sr</option>\n                <option>Abogado Sr</option>\n                <option>Procurador</option>\n              </optgroup>\n            </select>\n          </div>\n        </div>\n\n        <!-- Condicional MODIFICACIÓN -->\n        <div class=\"conditional\" id=\"condModif\" style=\"margin-top:20px;\">\n          <div class=\"field\">\n            <label class=\"req-star\">¿Mantiene los accesos actuales?</label>\n            <div class=\"radio-group\" id=\"mantieneGroup\">\n              <label class=\"radio-opt\"><input type=\"radio\" name=\"mantieneAcc\" value=\"Sí\">Sí</label>\n              <label class=\"radio-opt\"><input type=\"radio\" name=\"mantieneAcc\" value=\"No\">No</label>\n            </div>\n          </div>\n          <div class=\"field\" id=\"wrapPlazo\" style=\"display:none;\">\n            <label>¿Qué accesos mantiene y por cuánto tiempo?</label>\n            <div class=\"hint\">Detallá cuáles conserva y hasta cuándo. Sin fecha de corte, Soporte no revoca los accesos.</div>\n            <input type=\"text\" id=\"plazoAccesos\" placeholder=\"Ej: \\\\servidor\\Impuestos y Tango, hasta el 30/09\">\n          </div>\n        </div>\n\n        <div class=\"field\" style=\"margin-top:20px;\" id=\"wrapAccesos\">\n          <label>Especificar accesos</label>\n          <div class=\"hint\">Detallar rutas de red, carpetas compartidas, sistemas o permisos específicos que necesita el usuario.</div>\n          <input type=\"text\" id=\"rutaFileServer\" placeholder=\"Ruta de file server — ej: \\\\servidor\\carpeta\\subcarpeta\" style=\"margin-bottom:10px;\">\n          <input type=\"text\" id=\"rutaSharepoint\" placeholder=\"Ruta / carpeta raíz de SharePoint\" style=\"margin-bottom:10px;\">\n          <input type=\"text\" id=\"sistemasApps\" placeholder=\"Sistemas o aplicaciones — ej: Tango, Lex-Doctor, IDEA\" style=\"margin-bottom:10px;\">\n          <div class=\"alert info\" id=\"avisoSinAccesos\" style=\"margin-top:14px;display:none;\">\n            <span>ⓘ</span>\n            <span>Si no se indica ningún acceso, el usuario contará <strong>únicamente con correo electrónico y las herramientas básicas de Office</strong> (Word, Excel, PowerPoint y Teams).</span>\n          </div>\n        </div>\n\n      </div>\n    </div>\n\n    <!-- SECTOR Y CENTRO DE COSTOS -->\n    <div class=\"card\">\n      <div class=\"section-title\">Sector y Centro de Costos</div>\n      <div class=\"card-body\">\n\n        <div class=\"row2\">\n          <div class=\"field\">\n            <label class=\"req-star\">Sector / Departamento</label>\n            <div class=\"hint\" style=\"visibility:hidden;\">.</div>\n            <select id=\"sector\" required=\"\">\n              <option value=\"\">-----</option>\n              <option>Administración</option>\n              <option>Auditoría Externa</option>\n              <option>Auditoría Financiera</option>\n              <option>Auditoría Financiera &gt; Servicios Actuariales</option>\n              <option>Centro de Transformación Digital</option>\n              <option>Comercial</option>\n              <option>Compliance</option>\n              <option>Consultoría</option>\n              <option>Derecho Aduanero y Cambiario</option>\n              <option>Energía</option>\n              <option>Gestión del Talento Humano</option>\n              <option>Impuestos</option>\n              <option>Innovación y Desarrollo</option>\n              <option>Legales</option>\n              <option>Marketing</option>\n              <option>Precios y Transferencias</option>\n              <option>PYMES</option>\n              <option>Resguarda</option>\n              <option>Sistemas</option>\n              <option>Sociedades</option>\n              <option>Socios</option>\n              <option>Soluciones Informáticas</option>\n            </select>\n          </div>\n          <div class=\"field\">\n            <label class=\"req-star\">Centro de Costos</label>\n            <div class=\"hint\">Se filtra automáticamente según la Oficina seleccionada.</div>\n            <select id=\"centroCostos\" required=\"\">\n              <option value=\"\">Elegí primero la Oficina...</option>\n            </select>\n          </div>\n        </div>\n      </div>\n    </div>\n\n    <!-- OBSERVACIONES -->\n    <div class=\"card\">\n      <div class=\"section-title\">Observaciones</div>\n      <div class=\"card-body\">\n        <div class=\"field\">\n          <label>Características Especiales</label>\n          <textarea id=\"caracEspeciales\"></textarea>\n        </div>\n      </div>\n    </div>\n\n    <!-- IMPORTANTE -->\n    <div class=\"card\">\n      <div class=\"card-body\">\n        <div class=\"alert danger\" style=\"margin-bottom:16px;\">\n          <span>⚠️</span>\n          <span><strong>IMPORTANTE, leer:</strong> <span id=\"importanteTexto\">GTH debe registrar el ABM con una anticipación mínima de <strong>48 hs hábiles</strong>, y la preparación de 1 a 10 equipos por parte de Soporte Técnico requiere <strong>4 días hábiles</strong>, sin excepción. Si el pedido se genera después de las 14:00 hs, el plazo comenzará a contarse a partir del siguiente día hábil.<br><br>Los pedidos ingresados fuera de ese plazo no garantizan que la cuenta, los accesos y el equipo puedan estar listos en la fecha requerida.<br><br>Antes de enviar la solicitud, verifique que todos los datos ingresados sean correctos, ya que serán utilizados para ejecutar el alta.</span></span>\n        </div>\n        <div class=\"agree\">\n          <input type=\"checkbox\" id=\"leido\" required=\"\">\n          <label for=\"leido\">Leído</label>\n        </div>\n      </div>\n    </div>\n\n    <button type=\"submit\" class=\"submit\">Generar resumen para el ticket</button>\n    <p class=\"footer-note\" style=\"margin-top:14px;text-align:center;\">Al hacer click se abre una pestaña nueva con todos los datos formateados, listos para copiar y pegar en el <a href=\"https://portal.llyasoc.com/tickets/soporte\" target=\"_blank\" style=\"color:var(--teal-dark);font-weight:700;\">Sistema de Tickets - Portal GO</a>.</p>\n  </form>\n\n</main>\n\n<footer>\n  <img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABXEAAAHECAYAAAB/WWngAAAACXBIWXMAAAsSAAALEgHS3X78AAAgAElEQVR4nOzd3XNj13nn+x86kqyXkkn72EwqcYrwnMtz6pC+Ob4k9A+chq/WjuOE0IR+t9KUbMmSJZugYztzUjUjauZMVeJR0uiZTLJXJhmhq869wMu+MvkXCKypmpLoE5tMT5zYHjfOxV5gg2i+4GVtrLX3/n6qKDVJYOHhJkCCPzz7WbXBYKCV3e66pGVlGnqo7t409rFVzWf/go8dSDoZeb83/MfxTrM3fmEgNlv37tf18PEy+phadu+PWpa0NudNHur8Y0aS+u5taPRxdfD2p58dvzwAA ,\n    \"Córdoba\": [\"CORDOBA-AUD CBA\",\"CORDOBA-IMP AU\",\"CORDOBA-IMP DR\",\"CORDOBA-NA CORDOBA\"],\n    \"Corrientes\": [\"CORRIENTES-AUD CM\",\"CORRIENTES-IMP DE.L\",\"CORRIENTES-LEGALES\",\"CORRIENTES-LEGALES D\",\"CORRIENTES-NA CTES\",\"CORRIENTES-PYMES\"],\n    \"Mendoza\": [\"MENDOZA-AUD MDZA\",\"MENDOZA-EF AUD-AE\",\"MENDOZA-LEGALES A\",\"MENDOZA-NICASTRO\",\"MENDOZA-NICASTROPY\"],\n    \"Rosario\": [\"ROSARIO-AGRO\",\"ROSARIO-AUD ED\",\"ROSARIO-AUD LZ\",\"ROSARIO-AUD MP\",\"ROSARIO-IMP FR\",\"ROSARIO-IMP HA\",\"ROSARIO-LEGALES\",\"ROSARIO-NA ROSARIO\",\"ROSARIO-SEMILLERO\"],\n    \"Tigre\": [\"TIGRE-AUD ASG\",\"TIGRE-AUD TIGRE\",\"TIGRE-DAC\",\"TIGRE-IMP EJ\",\"TIGRE-IMP JMA\",\"TIGRE-IMP PL\",\"TIGRE-NA TIGRE\",\"TIGRE-PT\"],\n    \"Neuquén\": [\"NEUQUEN-IMP FLC\"],\n    \"General\": [\"GENERAL-ADM\",\"GENERAL-FIN-D.ORG\",\"GENERAL-GTH ADM\",\"GENERAL-I+D\",\"GENERAL-MKT\",\"GENERAL-SISTEMAS\",\"SOCIOS-SOCIOS\"]\n  };\n\n  const oficinaSel = document.getElementById('oficina');\n  const centroSel = document.getElementById('centroCostos');\n\n  oficinaSel.addEventListener('change', ()=>{\n    const oficina = oficinaSel.value;\n    centroSel.innerHTML = '';\n    if(!oficina){\n      centroSel.innerHTML = '<option value=\"\">Elegí primero la Oficina...</option>';\n      return;\n    }\n    centroSel.innerHTML = '<option value=\"\">-----</option>';\n    const propios = COST_CENTERS[oficina] || [];\n    if(propios.length){\n      const og = document.createElement('optgroup');\n      og.label = oficina;\n      propios.forEach(cc=>{\n        const opt = document.createElement('option'); opt.value=cc; opt.textContent=cc; og.appendChild(opt);\n      });\n      centroSel.appendChild(og);\n    }\n    const og2 = document.createElement('optgroup');\n    og2.label = 'General / Socios';\n    COST_CENTERS['General'].forEach(cc=>{\n      const opt = document.createElement('option'); opt.value=cc; opt.textContent=cc; og2.appendChild(opt);\n    });\n    centroSel.appendChild(og2);\n    if(!propios.length && oficina!=='General'){\n      const notice = document.createElement('option');\n      notice.disabled = true;\n      notice.textContent = '⚠ Sin centros de costos propios registrados para ' + oficina + ' — verificar con Administración';\n      centroSel.insertBefore(notice, centroSel.children[1]);\n    }\n  });\n\n  // ==== Integracion con Inventario/UserManager LLYA: mapeo Oficina <-> Sede ====\n  const OFICINA_TO_SEDE = {\n    \"CABA 1\":\"CABA1\", \"CABA 2\":\"CABA2\", \"Tigre\":\"Tigre\", \"Corrientes\":\"Corrientes\",\n    \"Rosario\":\"Rosario\", \"Córdoba\":\"Cordoba\", \"Mendoza\":\"Mendoza\", \"Neuquén\":\"Neuquen\"\n  };\n  const SEDE_TO_OFICINA = {\n    \"CABA1\":\"CABA 1\", \"CABA2\":\"CABA 2\", \"Resguarda\":\"CABA 2\", \"Tigre\":\"Tigre\",\n    \"Corrientes\":\"Corrientes\", \"Rosario\":\"Rosario\", \"Cordoba\":\"Córdoba\",\n    \"Mendoza\":\"Mendoza\", \"Neuquen\":\"Neuquén\"\n  };\n  window.UM_API = \"https://192.168.100.116:8444/api\";\n\n  // ==== Clasificacion Sector / Centro de Costos por formato (la nomina tiene datos cargados\n  // de forma inconsistente entre columnas; detectamos por el FORMATO del valor) ====\n  function pareceCentroCosto(v){\n    if(!v) return false;\n    return /^[A-Za-zÁÉÍÓÚÑáéíóúñ.]+(\\s?\\d)?\\s*-/.test(v.trim());\n  }\n  function clasificarSectorCentro(subauxiliar, centro_costo){\n    const a = (subauxiliar||'').trim();\n    const b = (centro_costo||'').trim();\n    const aEsCentro = pareceCentroCosto(a);\n    const bEsCentro = pareceCentroCosto(b);\n    if(aEsCentro && !bEsCentro) return { sector: b, centroCostos: a };\n    if(bEsCentro && !aEsCentro) return { sector: a, centroCostos: b };\n    return { sector: a, centroCostos: b };\n  }\n  function splitNombre(nombreCompleto){\n    const partes = (nombreCompleto||'').split(',');\n    const apellidos = (partes[0]||'').trim();\n    const nombres = (partes.slice(1).join(',')||'').trim();\n    return { nombres, apellidos };\n  }\n\n  // ==== Traer equipos y licencias asignados (SOLO LECTURA - GET, no modifica nada) ====\n  function cargarEquiposYLicencias(empleadoId){\n    if(!empleadoId) return;\n    Promise.all([\n      fetch(window.UM_API+'/empleados/'+empleadoId+'/hardware').then(r=>r.ok?r.json():[]).catch(()=>[]),\n      fetch(window.UM_API+'/empleados/'+empleadoId+'/licencias').then(r=>r.ok?r.json():[]).catch(()=>[])\n    ]).then(([hardware, licenciasResp])=>{\n      const hwTexto = (hardware||[]).map(h=>h.descripcion||h.tipo).join(', ') || 'Sin equipos';\n      const licTexto = (licenciasResp||[]).map(l=>(l.licencia&&l.licencia.nombre)||l.licencia_nombre||'Licencia').join(', ') || 'Sin licencias';\n      window.__hardwareTexto = hwTexto;\n      window.__licenciasTexto = licTexto;\n      const cardEq = document.getElementById('cardEquiposLicencias');\n      if(cardEq){\n        document.getElementById('listaEquipos').textContent = hwTexto;\n        document.getElementById('listaLicencias').textContent = licTexto;\n        cardEq.style.display = 'block';\n      }\n    });\n  }\n\n  // ==== Aplica los datos de un empleado al formulario (desde URL o desde la busqueda) ====\n  function aplicarPrefillEmpleado(datos){\n    const setVal = (id,v)=>{ if(v){ const el=document.getElementById(id); if(el) el.value=v; } };\n    const setSelectConFallback = (id,v)=>{\n      if(!v) return;\n      const el = document.getElementById(id);\n      if(!el) return;\n      const yaExiste = Array.from(el.options).some(o=>o.value.toLowerCase()===v.toLowerCase());\n      if(!yaExiste){\n        const opt = document.createElement('option');\n        opt.value = v; opt.textContent = v;\n        el.insertBefore(opt, el.firstChild.nextSibling);\n      }\n      el.value = v;\n    };\n\n    setVal('legajo', datos.legajo);\n    setVal('nombres', datos.nombres);\n    setVal('apellidos', datos.apellidos);\n    setVal('emailUsuario', datos.email);\n    setSelectConFallback('puesto', datos.puesto);\n    setSelectConFallback('sector', datos.sector);\n\n    const oficinaParam = datos.sede ? (SEDE_TO_OFICINA[datos.sede] || '') : (datos.oficina || '');\n    if(oficinaParam){\n      setVal('oficina', oficinaParam);\n      oficinaSel.dispatchEvent(new Event('change'));\n      if(datos.centroCostos){ setTimeout(()=>{ setSelectConFallback('centroCostos', datos.centroCostos); }, 30); }\n    }\n\n    if(datos.tipo){\n      const radio = document.querySelector('input[name=tipoAbm][value=\"'+datos.tipo+'\"]');\n      if(radio){\n        radio.checked = true;\n        radio.closest('.radio-opt').classList.add('sel');\n        radio.dispatchEvent(new Event('change'));\n      }\n    }\n\n    window.__empleadoId = datos.empleadoId || '';\n    window.__emailActual = datos.email || '';\n    window.__estadoActual = datos.estado || 'Activo';\n    cargarEquiposYLicencias(window.__empleadoId);\n  }\n\n  // ==== Prefill desde parametros de la URL (llega desde Inventario/UserManager LLYA) ====\n  (function(){\n    const params = new URLSearchParams(window.location.search);\n    aplicarPrefillEmpleado({\n      legajo: params.get('legajo'), nombres: params.get('nombres'), apellidos: params.get('apellidos'),\n      puesto: params.get('puesto'), sector: params.get('sector'), sede: params.get('sede'),\n      oficina: params.get('oficina'), centroCostos: params.get('centroCostos'), tipo: params.get('tipo'),\n      empleadoId: params.get('empleadoId'), email: params.get('email'), estado: params.get('estado')\n    });\n  })();\n\n  // ==== Buscar empleado existente (autocompletado, SOLO LECTURA - GET) ====\n  (function(){\n    let empleadosMap = {};\n    fetch(window.UM_API+'/empleados/con-licencias').then(r=>r.ok?r.json():[]).then(lista=>{\n      const datalist = document.getElementById('empleadosDatalist');\n      (lista||[]).forEach(emp=>{\n        const etiqueta = emp.nombre + ' (Legajo ' + emp.legajo + ')';\n        empleadosMap[etiqueta] = emp;\n        const opt = document.createElement('option');\n        opt.value = etiqueta;\n        datalist.appendChild(opt);\n      });\n    }).catch(()=>{});\n\n    document.getElementById('apellidos').addEventListener('input', function(){\n      const emp = empleadosMap[this.value];\n      if(!emp) return;\n      const tipoActual = (document.querySelector('input[name=tipoAbm]:checked')||{}).value || '';\n      if(tipoActual === 'Alta') return; // en Alta se carga un empleado nuevo, no se autocompleta desde uno existente\n      const nombreSplit = splitNombre(emp.nombre);\n      const clasif = clasificarSectorCentro(emp.subauxiliar, emp.centro_costo);\n      aplicarPrefillEmpleado({\n        legajo: emp.legajo, nombres: nombreSplit.nombres, apellidos: nombreSplit.apellidos,\n        puesto: emp.categoria, sector: clasif.sector, sede: emp.sede, centroCostos: clasif.centroCostos,\n        empleadoId: emp.id, email: emp.email, estado: emp.estado\n      });\n    });\n  })();\n\n  // Toggle radio visual selection\n  document.querySelectorAll('.radio-group').forEach(group=>{\n    group.querySelectorAll('.radio-opt').forEach(opt=>{\n      opt.addEventListener('click', ()=>{\n        group.querySelectorAll('.radio-opt').forEach(o=>o.classList.remove('sel'));\n        opt.classList.add('sel');\n        opt.querySelector('input').checked = true;\n        opt.querySelector('input').dispatchEvent(new Event('change'));\n      });\n    });\n  });\n\n  const condBaja = document.getElementById('condBaja');\n  const condAlta = document.getElementById('condAlta');\n  const condModif = document.getElementById('condModif');\n\n  document.querySelectorAll('input[name=tipoAbm]').forEach(r=>{\n    r.addEventListener('change', ()=>{\n      condBaja.classList.toggle('show', r.value==='Baja' && r.checked);\n      condAlta.classList.toggle('show', r.value==='Alta' && r.checked);\n      condModif.classList.toggle('show', r.value==='Modificación' && r.checked);\n      if(r.checked){\n        const esAlta = r.value==='Alta';\n        document.getElementById('textoFechaEjecucion').textContent = esAlta ? 'Fecha de ingreso' : 'Fecha de ejecución';\n        document.getElementById('tipFecha').style.display = esAlta ? 'none' : 'inline-block';\n        document.getElementById('tipManager').innerHTML = esAlta\n          ? 'Responsable / tutor del ingresante a efectos de IT: es quien Soporte va a contactar para confirmar los accesos y la entrega del equipo. Si todavía no está definido, cargá al manager del sector.'\n          : (r.value==='Baja'\n            ? 'Manager del que dependía el usuario. Es quien indica a Soporte qué hacer con el correo, la información y el equipo que quedan.'\n            : 'Responsable del que depende el usuario. Si la modificación implica cambio de manager, indicá acá el nuevo.');\n        document.getElementById('wrapAccesos').style.display = (r.value==='Baja') ? 'none' : 'block';\n        document.getElementById('wrapEmailUsuario').style.display = (r.value==='Baja') ? 'block' : 'none';\n      document.getElementById('wrapEmailManager').style.display = (r.value==='Baja' || r.value==='Alta') ? 'block' : 'none';\n        document.getElementById('avisoSinAccesos').style.display = esAlta ? 'flex' : 'none';\n        document.getElementById('importanteTexto').innerHTML = TEXTO_IMPORTANTE[r.value] || TEXTO_IMPORTANTE['Alta'];\n        // En Baja/Modificación el usuario ya existe: no hace falta la aclaración de nombres/apellidos\n        document.getElementById('tipNombres').style.display = esAlta ? 'inline-block' : 'none';\n        document.getElementById('tipApellidos').style.display = esAlta ? 'inline-block' : 'none';\n        document.getElementById('tipLegajo').innerHTML = esAlta\n          ? 'Número de legajo asignado en <strong>Portal GO</strong> por Gestión del Talento Humano. Si el ingresante todavía no lo tiene, GTH debe cargarlo antes de enviar el ABM.'\n          : 'Indicá el número de legajo que le corresponde al empleado en <strong>Portal GO</strong>.';\n      }\n    });\n  });\n\n  // Textos del aviso IMPORTANTE segun el tipo de ABM\n  const TEXTO_IMPORTANTE = {\n    'Alta': 'GTH debe registrar el ABM con una anticipación mínima de <strong>48 hs hábiles</strong>, y la preparación de 1 a 10 equipos por parte de Soporte Técnico requiere <strong>4 días hábiles</strong>, sin excepción. Si el pedido se genera después de las 14:00 hs, el plazo comenzará a contarse a partir del siguiente día hábil.<br><br>Los pedidos ingresados fuera de ese plazo no garantizan que la cuenta, los accesos y el equipo puedan estar listos en la fecha requerida.<br><br>Antes de enviar la solicitud, verifique que todos los datos ingresados sean correctos, ya que serán utilizados para ejecutar el alta.',\n    'Baja': 'GTH debe registrar las solicitudes de baja con una anticipación mínima de <strong>48 hs hábiles</strong> respecto de la fecha de desvinculación. Las solicitudes ingresadas fuera de ese plazo no garantizan que la desactivación de la cuenta y los accesos pueda realizarse en la fecha requerida.<br><br>Una vez ejecutada la baja, <strong>la cuenta del usuario, su buzón de correo y la información almacenada en OneDrive permanecerán en resguardo durante 3 meses</strong>. Durante ese período, el socio, director, gerente o manager del área podrá solicitar el acceso a información específica, la redirección del correo o la exportación de datos, cuando resulte necesario.<br><br>Finalizado el período de resguardo, la cuenta, el buzón, los archivos de OneDrive y todos los accesos asociados serán eliminados de forma definitiva, <strong>sin posibilidad de recuperar la información</strong>.',\n    'Modificación': 'Las solicitudes de modificación no se procesan de forma inmediata. GTH debe registrar el ABM con una anticipación mínima de <strong>48 hs hábiles</strong> respecto de la fecha en que la modificación deba estar aplicada. Si el pedido se genera después de las 14:00 hs, el plazo comenzará a contarse a partir del siguiente día hábil.<br><br>Los pedidos ingresados fuera de ese plazo no garantizan que la modificación pueda realizarse en la fecha solicitada.<br><br>Antes de enviar la solicitud, verifique que todos los datos ingresados sean correctos, ya que serán utilizados para ejecutar la modificación.'\n  };\n\n  // Plazo de accesos en Modificación\n  document.querySelectorAll('input[name=mantieneAcc]').forEach(r=>{\n    r.addEventListener('change', ()=>{\n      document.getElementById('wrapPlazo').style.display = (r.value==='Sí' && r.checked) ? 'block' : 'none';\n    });\n  });\n\n  // Limpia el formulario despues de generar el resumen\n  function limpiarFormulario(){\n    document.getElementById('abmForm').reset();\n    document.querySelectorAll('.radio-opt.sel').forEach(o=>o.classList.remove('sel'));\n    document.querySelectorAll('.conditional.show').forEach(c=>c.classList.remove('show'));\n    document.getElementById('wrapPlazo').style.display = 'none';\n    document.getElementById('wrapAccesos').style.display = 'block';\n    document.getElementById('wrapEmailUsuario').style.display = 'none';\n    document.getElementById('avisoSinAccesos').style.display = 'none';\n    document.getElementById('tipNombres').style.display = 'inline-block';\n    document.getElementById('tipApellidos').style.display = 'inline-block';\n    document.getElementById('textoFechaEjecucion').textContent = 'Fecha de ejecución';\n    document.getElementById('tipFecha').style.display = 'inline-block';\n    document.getElementById('importanteTexto').innerHTML = TEXTO_IMPORTANTE['Alta'];\n    centroSel.innerHTML = '<option value=\"\">Elegí primero la Oficina...</option>';\n    window.scrollTo({top:0, behavior:'smooth'});\n  }\n\n  document.getElementById('abmForm').addEventListener('submit', async function(e){\n    e.preventDefault();\n    const tipoAbm = (document.querySelector('input[name=tipoAbm]:checked')||{}).value || '';\n    if(!tipoAbm){ alert('Por favor seleccioná el Tipo de ABM.'); return; }\n    if(!document.getElementById('leido').checked){ alert('Tenés que tildar \"Leído\" en el aviso importante antes de generar el resumen.'); return; }\n\n    const val = id => (document.getElementById(id)||{}).value || '';\n    if(tipoAbm==='Baja' && !val('emailUsuario')){ alert('Completá el mail del usuario que se da de baja.'); document.getElementById('emailUsuario').focus(); return; }\n    if((tipoAbm==='Baja' || tipoAbm==='Alta') && !val('emailManager')){ alert('Completá el mail del manager.'); document.getElementById('emailManager').focus(); return; }\n\n    // Abrimos la pestaña ANTES de generar el resumen (para no bloquear el popup)\n    const win = window.open('', '_blank');\n    if(!win){\n      alert('El navegador bloqueó la pestaña nueva. Habilitá los pop-ups para este sitio e intentá de nuevo.');\n      return;\n    }\n\n    // IMPORTANTE: este formulario publico SOLO genera el resumen para pegar en el ticket.\n    // La ejecucion real (alta/baja/modificacion en la base) se hace desde el sistema interno\n    // (Inventario/UserManager LLYA), que requiere inicio de sesion.\n\n    // Fecha automática del día en que se genera el ABM\n    const hoy = new Date();\n    const fechaHoy = hoy.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit', year:'numeric'});\n    const esAlta = tipoAbm==='Alta';\n    const labelFecha = esAlta ? 'Fecha de ingreso' : 'Fecha de ejecución';\n    const labelMgr = 'Manager';\n\n    // Filas [etiqueta, valor] a mostrar en el resumen\n    const rows = [\n      ['N° de Legajo', val('legajo')],\n      ['Tipo de ABM', tipoAbm],\n      ['Fecha de generación', fechaHoy],\n      ['Solicitante de ABM', val('solicitante')],\n      [labelFecha, val('fechaEjecucion')],\n      ['—','—'],\n      ['Nombres', val('nombres')],\n      ['Apellidos', val('apellidos')],\n      [labelMgr, val('manager')],\n      ...((tipoAbm==='Baja' || tipoAbm==='Alta') ? [['Mail del manager', val('emailManager') || '-']] : []),\n      ['Oficina', val('oficina')],\n      ['Puesto / Categoría', val('puesto')],\n      ['—','—'],\n      ['Sector / Departamento', val('sector')],\n      ['Centro de Costos', val('centroCostos')]\n    ];\n\n    // Acceso a carpetas (solo alta/modif, no en baja)\n    if(tipoAbm!=='Baja'){\n      const hayAccesos = val('rutaFileServer') || val('rutaSharepoint') || val('sistemasApps');\n      rows.push(['—','—']);\n      if(val('rutaFileServer')) rows.push(['Ruta File Server', val('rutaFileServer')]);\n      if(val('rutaSharepoint')) rows.push(['Ruta SharePoint', val('rutaSharepoint')]);\n      if(val('sistemasApps')) rows.push(['Sistemas o aplicaciones', val('sistemasApps')]);\n      if(!hayAccesos && tipoAbm==='Alta') rows.push(['Accesos', 'No se indicaron accesos: el usuario contará únicamente con correo y las herramientas básicas de Office.']);\n    }\n\n    if(tipoAbm!=='Alta' && (window.__hardwareTexto || window.__licenciasTexto)){\n      rows.push(['—','—']);\n      rows.push(['Equipos asignados', window.__hardwareTexto || 'Sin equipos']);\n      rows.push(['Licencias asignadas', window.__licenciasTexto || 'Sin licencias']);\n    }\n\n    if(tipoAbm==='Baja'){\n      rows.push(['—','—'], ['Mail del usuario', val('emailUsuario') || '-'], ['Cuenta y buzón de correo', 'Se mantienen en resguardo por 3 meses desde la baja. Cumplido el plazo se eliminan de forma definitiva junto con todos los accesos.']);\n    }\n\n    if(tipoAbm==='Modificación'){\n      const mant = (document.querySelector('input[name=mantieneAcc]:checked')||{}).value || '-';\n      rows.push(['—','—'], ['¿Mantiene los accesos actuales?', mant]);\n      if(mant==='Sí' && val('plazoAccesos')) rows.push(['Plazo de los accesos', val('plazoAccesos')]);\n      rows.push(['Plazo de ejecución', 'Los cambios no son automáticos: se aplican en un mínimo de 48 hs hábiles.']);\n    }\n\n    rows.push(['—','—'], ['Características Especiales', val('caracEspeciales') || '-']);\n\n    const plainText = rows\n      .filter(r=>r[0]!=='—')\n      .map(r=> r[0] + ': ' + (r[1] || '-'))\n      .join('\\n');\n\n    const rowsHtml = rows.map(r=>{\n      if(r[0]==='—') return '<tr class=\"sep\"><td colspan=\"2\"></td></tr>';\n      return '<tr><td class=\"lbl\">'+escapeHtml(r[0])+'</td><td class=\"val\">'+escapeHtml(r[1]||'-').replace(/\\n/g,'<br>')+'</td></tr>';\n    }).join('');\n\n    const titulo = 'ABM ' + tipoAbm + ' — ' + val('nombres') + ' ' + val('apellidos');\n\n    const summaryHtml = `<!DOCTYPE html>\n<html lang=\"es\"><head><meta charset=\"UTF-8\"><title>${escapeHtml(titulo)}</title>\n<style>\n  body{font-family:'Segoe UI',Arial,sans-serif;background:#F5F6F7;margin:0;padding:32px;color:#3A3A3A;}\n  .wrap{max-width:760px;margin:0 auto;background:#fff;border:1px solid #DDE3E6;border-radius:10px;overflow:hidden;}\n  .head{background:#12404F;color:#fff;padding:22px 28px;border-bottom:4px solid #00AEAE;}\n  .head h1{margin:0 0 4px;font-size:20px;}\n  .head p{margin:0;color:#cfe4e8;font-size:13px;}\n  table{width:100%;border-collapse:collapse;}\n  td{padding:10px 28px;font-size:14px;vertical-align:top;border-bottom:1px solid #EEE;}\n  td.lbl{font-weight:700;color:#12404F;width:220px;white-space:nowrap;}\n  td.val{color:#111;}\n  tr.sep td{padding:4px;border-bottom:none;}\n  .actions{padding:18px 28px;background:#EAF3F6;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}\n  button{background:#00878A;color:#fff;border:none;padding:11px 20px;border-radius:6px;font-weight:700;font-size:14px;cursor:pointer;}\n  button:hover{background:#00AEAE;}\n  .copied{color:#00878A;font-weight:700;font-size:13.5px;display:none;}\n  textarea{position:absolute;left:-9999px;}\n  @media print{ .actions{display:none;} body{background:#fff;padding:0;} .wrap{border:none;} }\n</style><template id=\"__bundler_thumbnail\" data-bg-color=\"#12404F\">\n  <svg viewBox=\"0 0 1200 800\" xmlns=\"http://www.w3.org/2000/svg\">\n    <rect width=\"1200\" height=\"800\" fill=\"#12404F\"/>\n    <rect x=\"360\" y=\"180\" width=\"480\" height=\"440\" rx=\"28\" fill=\"#ffffff\"/>\n    <rect x=\"360\" y=\"180\" width=\"480\" height=\"70\" rx=\"28\" fill=\"#EAF3F6\"/>\n    <rect x=\"360\" y=\"222\" width=\"480\" height=\"28\" fill=\"#EAF3F6\"/>\n    <rect x=\"404\" y=\"204\" width=\"180\" height=\"22\" rx=\"11\" fill=\"#1C6478\"/>\n    <rect x=\"404\" y=\"300\" width=\"392\" height=\"52\" rx=\"12\" fill=\"#F5F6F7\"/>\n    <rect x=\"404\" y=\"378\" width=\"392\" height=\"52\" rx=\"12\" fill=\"#F5F6F7\"/>\n    <rect x=\"404\" y=\"456\" width=\"392\" height=\"52\" rx=\"12\" fill=\"#F5F6F7\"/>\n    <rect x=\"404\" y=\"536\" width=\"392\" height=\"52\" rx=\"12\" fill=\"#00AEAE\"/>\n  </svg>\n</template>\n</head>\n<body>\n  <div class=\"wrap\">\n    <div class=\"head\">\n      <h1>${escapeHtml(titulo)}</h1>\n      <p>Resumen generado para pegar en el Sistema de Tickets - Portal GO</p>\n    </div>\n    <div class=\"actions\">\n      <button onclick=\"copiarTodo()\">📋 Copiar todo</button>\n      <button onclick=\"window.print()\">🖨️ Imprimir / Guardar PDF</button>\n      <a href=\"https://portal.llyasoc.com/tickets/soporte\" target=\"_blank\" style=\"background:#12404F;color:#fff;text-decoration:none;padding:11px 20px;border-radius:6px;font-weight:700;font-size:14px;\">🎫 Ir al Portal GO</a>\n      <span class=\"copied\" id=\"copiedMsg\">✅ Copiado al portapapeles</span>\n    </div>\n    <table>${rowsHtml}</table>\n  </div>\n  <textarea id=\"plainText\">${plainText.replace(/</g,'&lt;')}</textarea>\n  <script>\n    function copiarTodo(){\n      const ta = document.getElementById('plainText');\n      ta.style.left = '0px'; ta.select();\n      try{\n        navigator.clipboard.writeText(ta.value).then(showCopied, function(){\n          document.execCommand('copy'); showCopied();\n        });\n      }catch(e){\n        document.execCommand('copy'); showCopied();\n      }\n      ta.style.left = '-9999px';\n    }\n    function showCopied(){\n      const m = document.getElementById('copiedMsg');\n      m.style.display='inline'; setTimeout(()=>m.style.display='none', 2500);\n    }\n  <\\/script>\n</body></html>`;\n\n    win.document.open();\n    win.document.write(summaryHtml);\n    win.document.close();\n\n    limpiarFormulario();\n  });\n\n  function escapeHtml(str){\n    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');\n  }\n<\/script>\n\n\n\n</body></html>"
  </script>
